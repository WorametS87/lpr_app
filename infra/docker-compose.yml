services:
  postgres:
    image: postgres:16
    container_name: lpr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lpr
      POSTGRES_USER: lpr
      POSTGRES_PASSWORD: lpr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpr -d lpr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-bookworm
    container_name: lpr-api
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: lpr
      DB_USER: lpr
      DB_PASSWORD: lpr
      TYPEORM_SYNC: "true"
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-http://host.docker.internal:8000}
    volumes:
      - ../:/workspace
      - api_node_modules:/workspace/node_modules
    command: sh -c "npm install && npm run dev:api"
    ports:
      - "3000:3000"

  web:
    image: node:20-bookworm
    container_name: lpr-web
    working_dir: /workspace
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    volumes:
      - ../:/workspace
      - web_node_modules:/workspace/node_modules
    command: sh -c "npm install && npm --workspace apps/web run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
